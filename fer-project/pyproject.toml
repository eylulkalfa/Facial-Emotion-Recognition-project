[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fer-project"
version = "0.1.0"
description = "Facial Emotion Recognition with PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.1",
    "torchvision",
    "timm>=0.9.16",
    "albumentations>=1.3.1",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "onnx-simplifier>=0.4",
    "onnxscript>=0.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tensorboard>=2.14",
    "gradio>=4.0",
    "PyYAML>=6.0",
    "dacite>=1.8",
    "pandas>=2.0",
    "tqdm>=4.65",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
