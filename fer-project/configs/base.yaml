experiment:
  name: "mobilenetv3_rafdb"
  seed: 42
  output_dir: "./experiments"

data:
  dataset: "rafdb"
  data_dir: "./data"
  input_size: 224
  batch_size: 64
  num_workers: 4
  pin_memory: true
  bypass_face_detection: true
  balance_classes: true

augmentation:
  horizontal_flip_prob: 0.5
  rotation_limit: 10
  rotation_prob: 0.3
  random_resized_crop_scale: [0.92, 1.0]
  color_jitter_prob: 0.25
  color_jitter_brightness: 0.15
  color_jitter_contrast: 0.15
  color_jitter_hue: 0.02
  random_erasing_prob: 0.1
  random_erasing_scale: [0.02, 0.10]
  mixup_alpha: 0.0

model:
  backbone: "mobilenetv3_large_100"
  pretrained: true
  num_classes: 7
  dropout: 0.2

training:
  phases:
    - name: "head_warmup"
      epochs: 5
      lr: 0.001
      freeze_backbone: true
    - name: "full_training"
      epochs: 20
      lr: 0.0001
      freeze_backbone: false
    - name: "fine_tune"
      epochs: 10
      lr: 0.00003
      freeze_backbone: false
  optimizer: "adamw"
  weight_decay: 0.0001
  loss: "weighted_ce"
  focal_gamma: 2.0
  focal_alpha: null
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 4
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  mixed_precision: true

export:
  opset_version: 17
  simplify: true
  dynamic_batch: true
