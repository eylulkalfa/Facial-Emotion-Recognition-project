# SOTA Vision Transformer (ViT-Base / ConvNeXt) + ArcFace Loss configuration
experiment:
  name: "vit_sota_arcface"

data:
  dataset: "combined"
  batch_size: 32
  num_workers: 4
  pin_memory: true
  balance_classes: true

model:
  backbone: "vit_base_patch16_224"
  pretrained: true
  dropout: 0.3

training:
  phases:
    - name: "head_warmup"
      epochs: 3
      lr: 0.0005
      freeze_backbone: true
    - name: "full_training"
      epochs: 15
      lr: 0.00005
      freeze_backbone: false
    - name: "fine_tune"
      epochs: 7
      lr: 0.00001
      freeze_backbone: false
  optimizer: "adamw"
  weight_decay: 0.01
  loss: "arcface"
  label_smoothing: 0.1
  scheduler: "reduce_on_plateau"
  scheduler_patience: 2
  early_stopping_patience: 5
