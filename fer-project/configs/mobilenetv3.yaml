# MobileNetV3-Large production configuration for RAF-DB
experiment:
  name: "mobilenetv3_rafdb_real"

data:
  dataset: "rafdb"
  batch_size: 64
  num_workers: 0
  balance_classes: true

model:
  backbone: "mobilenetv3_large_100"
  pretrained: true
  dropout: 0.2

training:
  phases:
    - name: "head_warmup"
      epochs: 3
      lr: 0.001
      freeze_backbone: true
    - name: "full_training"
      epochs: 10
      lr: 0.0001
      freeze_backbone: false
    - name: "fine_tune"
      epochs: 5
      lr: 0.00003
      freeze_backbone: false
  optimizer: "adamw"
  weight_decay: 0.0001
  loss: "weighted_ce"
  scheduler: "reduce_on_plateau"
  scheduler_patience: 2
  early_stopping_patience: 5
