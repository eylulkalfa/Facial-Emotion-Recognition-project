# ConvNeXt-Tiny configuration on Combined RAF-DB + FER2013 Dataset
experiment:
  name: "convnext_tiny_combined"

data:
  dataset: "combined"
  batch_size: 64
  num_workers: 4
  pin_memory: true
  balance_classes: true

model:
  backbone: "convnext_tiny"
  pretrained: true
  dropout: 0.4

training:
  phases:
    - name: "head_warmup"
      epochs: 3
      lr: 0.001
      freeze_backbone: true
    - name: "full_training"
      epochs: 15
      lr: 0.0001
      freeze_backbone: false
    - name: "fine_tune"
      epochs: 7
      lr: 0.00003
      freeze_backbone: false
  optimizer: "adamw"
  weight_decay: 0.0001
  loss: "focal"
  focal_gamma: 2.0
  label_smoothing: 0.1
  scheduler: "reduce_on_plateau"
  scheduler_patience: 2
  early_stopping_patience: 5
